<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portail numérique de services judiciaires – Maquette interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F7;--surface:#fff;--surface2:#F7F8FB;--ink:#141A2E;--muted:#596079;--line:#E0E3EC;--line2:#C9CEDB;
--indigo:#1D2A6B;--indigo2:#33449C;--isoft:#EAEDF8;--iink:#1D2A6B;--brass:#94640F;--bsoft:#F6EDDB;
--ok:#1B6B48;--oksoft:#E2F1E9;--warn:#855600;--warnsoft:#FBEFD6;--bad:#A3291F;--badsoft:#FBE6E3;--info:#22579A;--infosoft:#E5EEF9;
--btn:#1D2A6B;--btnfg:#fff;--head:#121A47;
--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1020;--surface:#141A2F;--surface2:#192038;--ink:#E8EBF4;--muted:#A3AAC0;--line:#252D48;--line2:#343D5E;
--indigo:#9DADF6;--indigo2:#B7C3FA;--isoft:#1E2750;--iink:#CBD3FB;--brass:#E2B65E;--bsoft:#382B12;
--ok:#7FD4A8;--oksoft:#12342A;--warn:#F0C66A;--warnsoft:#382A0C;--bad:#FF9C93;--badsoft:#3E1A18;--info:#8DB8F2;--infosoft:#152946;
--btn:#9DADF6;--btnfg:#0C1020;--head:#090D1D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1020;--surface:#141A2F;--surface2:#192038;--ink:#E8EBF4;--muted:#A3AAC0;--line:#252D48;--line2:#343D5E;
--indigo:#9DADF6;--indigo2:#B7C3FA;--isoft:#1E2750;--iink:#CBD3FB;--brass:#E2B65E;--bsoft:#382B12;
--ok:#7FD4A8;--oksoft:#12342A;--warn:#F0C66A;--warnsoft:#382A0C;--bad:#FF9C93;--badsoft:#3E1A18;--info:#8DB8F2;--infosoft:#152946;
--btn:#9DADF6;--btnfg:#0C1020;--head:#090D1D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--surface)}
body.app::before{background:var(--head)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0 0 .4em;color:var(--ink)}
h1{font-size:clamp(1.7rem,3vw,2.25rem)}h2{font-size:clamp(1.25rem,2vw,1.5rem)}h3{font-size:1.15rem}
h4{font:600 1rem/1.3 var(--sans);margin:0 0 .25em}
p{margin:0 0 .8em}a{color:var(--info)}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--indigo2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.muted{color:var(--muted)}.small{font-size:.875rem}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.proto{background:var(--bsoft);color:var(--brass);font-size:.8rem;text-align:center;padding:6px 12px}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btnfg);border:1.5px solid var(--btn);padding:10px 18px;border-radius:10px;font-weight:600;min-height:44px;text-decoration:none;transition:transform .15s var(--ease),box-shadow .2s,background-color .2s}
.btn:hover{box-shadow:0 8px 20px -10px var(--btn)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2)}.btn.sec:hover{background:var(--surface2);box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;color:var(--info);padding:6px 8px;min-height:40px}.btn.ghost:hover{box-shadow:none;text-decoration:underline}
.btn.lt{background:#fff;color:#121A47;border-color:#fff}.btn.ol{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}.btn.ol:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem;border-radius:8px}
.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.dng,:root:not([data-theme="light"]) .btn.okb{color:#0C1020}}
:root[data-theme="dark"] .btn.dng,:root[data-theme="dark"] .btn.okb{color:#0C1020}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}
.btn.wide{width:100%}
/* en-tête public */
.pub-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.pub-h .wrap{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand b{display:block;font:600 1.06rem/1.1 var(--serif)}.brand small{display:block;color:var(--muted);font-size:.76rem}
.pnav{display:flex;gap:2px;margin-left:auto}.pnav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}.pnav button:hover{color:var(--ink);background:var(--surface2)}
.pact{display:flex;gap:8px}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;align-items:center;justify-content:center}
.mnav{display:none}
/* héro */
.hero{position:relative;overflow:hidden;background:#121A47;color:#fff;padding:76px 0 88px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 88% 22%,rgba(255,255,255,.055) 0 1px,transparent 1px 15px);pointer-events:none}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,#B98A2E,#E2C27A 50%,#B98A2E)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.05rem,4.4vw,3.2rem);line-height:1.08;max-width:15ch}
.hero .lead{color:#C9D0EE;font-size:1.1rem;max-width:50ch}
.demo-card{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 34px 70px -24px rgba(0,0,0,.6)}
.herotrk{min-height:252px}
.a1,.a2,.a3,.a4{animation:rise .8s var(--ease) both}.a2{animation-delay:.08s}.a3{animation-delay:.16s}.a4{animation-delay:.26s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.hint svg{color:var(--iink)}
.band{padding:76px 0}.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.band .lead{color:var(--muted);max-width:62ch;font-size:1.05rem}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.space{display:flex;flex-direction:column;gap:12px}.space .ico{width:50px;height:50px;border-radius:14px;background:var(--isoft);color:var(--iink);display:grid;place-items:center}
.space ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}.space li{display:flex;gap:10px;color:var(--muted);font-size:.95rem}.space li svg{color:var(--ok);margin-top:3px}
.space .btn{margin-top:auto;align-self:flex-start}
.ways{display:flex;flex-direction:column;gap:22px}.way{display:flex;gap:16px}.way .ico{width:44px;height:44px;border-radius:12px;background:var(--bsoft);color:var(--brass);display:grid;place-items:center;flex:none}.way p{margin:2px 0 0;color:var(--muted)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;list-style:none;padding:0;margin:28px 0}
.steps li{counter-increment:s;position:relative;padding-top:52px}
.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:38px;height:38px;border-radius:50%;background:var(--btn);color:var(--btnfg);display:grid;place-items:center;font:600 1.1rem var(--serif)}
.steps li::after{content:"";position:absolute;top:18px;left:50px;right:-12px;height:2px;background:var(--line)}.steps li:last-child::after{display:none}
.steps p{color:var(--muted)}
.callout{display:flex;gap:14px;background:var(--isoft);border-left:4px solid var(--indigo2);border-radius:10px;padding:16px 18px;color:var(--ink)}.callout>svg{color:var(--iink);margin-top:2px}
.callout.warnc{background:var(--warnsoft);border-color:var(--warn)}.callout.warnc>svg{color:var(--warn)}
.callout.okc{background:var(--oksoft);border-color:var(--ok)}.callout.okc>svg{color:var(--ok)}
details.faq{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 18px}details.faq summary{padding:15px 0;cursor:pointer;font-weight:600}details.faq p{color:var(--muted)}
footer.pf{background:var(--head);color:#C1C8E6;padding:36px 0 96px;font-size:.9rem}
/* téléphone USSD */
.phone{width:270px;margin:0 auto;border-radius:38px;background:#0E1330;padding:16px 14px 20px;box-shadow:0 30px 60px -24px rgba(9,13,32,.55),inset 0 0 0 2px #2A3263}
.phone .top{width:70px;height:6px;border-radius:3px;background:#2A3263;margin:0 auto 14px}
.phone .scr{background:#D9E3CF;color:#141A10;border-radius:18px;min-height:280px;padding:16px;display:flex;flex-direction:column}
.phone pre{margin:0;white-space:pre-wrap;font:500 .95rem/1.45 var(--sans);flex:1}
.phone .in{display:flex;gap:6px;margin-top:12px}.phone input{flex:1;min-width:0;border:1px solid #9AA88F;border-radius:8px;padding:8px;background:#EEF3E8;color:#141A10;font:inherit}
.phone button{border:0;border-radius:8px;background:#1D2A6B;color:#fff;padding:8px 12px;font-weight:600}
.phone .cap{text-align:center;color:#8F98C4;font-size:.78rem;margin-top:12px}
/* formulaires */
label.f{display:block;font-weight:600;margin-bottom:16px}label.f span.h{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
input[type=text],input:not([type]),input[type=email],input[type=password],input[type=tel],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);margin-top:6px;min-height:46px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--indigo2);box-shadow:0 0 0 4px var(--isoft)}
.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:500!important}.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--indigo)}
.err{color:var(--bad);font-size:.92rem;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.otp{font:600 1.7rem/1 var(--serif)!important;letter-spacing:.45em;text-align:center}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 22px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.seg3 button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.seg3 button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,46,.15)}
.authbox{max-width:480px;margin:52px auto 110px;padding:0 16px}.authbox .card{padding:30px}
.secure{display:flex;gap:10px;font-size:.85rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:12px;margin-top:18px}
.verified{display:flex;gap:12px;align-items:center;background:var(--oksoft);color:var(--ok);border-radius:12px;padding:14px 16px;animation:pop .35s var(--ease)}
.checking{text-align:center;padding:18px 0 8px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--isoft);border-top-color:var(--indigo2);animation:sp .9s linear infinite;margin:10px auto 16px}@keyframes sp{to{transform:rotate(360deg)}}
/* coquille applicative */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head);color:#fff}
.appbar .in{display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:62px}
.appbar .brand small{color:#AEB7DE}
.ab{background:rgba(255,255,255,.08);border:0;color:#fff!important;border-radius:10px;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;position:relative;transition:background .15s}
.ab:hover{background:rgba(255,255,255,.16)}
.cnt{position:absolute;top:3px;right:3px;background:#E5484D;color:#fff;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.pill{background:rgba(255,255,255,.12);padding:4px 12px;border-radius:99px;font-size:.82rem}
.layout{display:grid;grid-template-columns:268px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{padding:16px 12px 90px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px));height:calc(100vh - 62px - env(safe-area-inset-top,0px));overflow:auto}
.who{padding:8px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}.who b{display:block;font-family:var(--serif);font-size:1.08rem}
.vf{display:inline-flex;gap:5px;align-items:center;color:var(--ok);font-size:.8rem;font-weight:600;margin-top:4px}
.nv{position:relative;display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:left;width:100%;min-height:44px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--surface2);color:var(--ink)}
.nv[aria-current=page]{background:var(--isoft);color:var(--iink);font-weight:600}
.nv[aria-current=page]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.nv .cnt{position:static;margin-left:auto}
main#main{padding:30px 32px 130px;min-width:0;min-height:calc(100vh - 100px)}
.enter{animation:viewin .4s var(--ease) both}@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.ph{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}.ph h1{margin:0}.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.crumb{font-size:.9rem;color:var(--muted);margin-bottom:10px}.crumb button{background:none;border:0;color:var(--info);padding:0}.crumb button:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:block;width:100%;transition:border-color .15s,transform .15s var(--ease)}
button.stat:hover{border-color:var(--indigo2);transform:translateY(-1px)}
.stat b{display:block;font:600 2rem/1.05 var(--serif);color:var(--ink)}.stat span{color:var(--muted);font-size:.9rem}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;font-weight:600;transition:border-color .15s,transform .15s var(--ease)}
.qa button:hover{border-color:var(--indigo2);transform:translateY(-2px)}
.qa .ico{width:42px;height:42px;border-radius:12px;background:var(--isoft);color:var(--iink);display:grid;place-items:center}
.next{position:relative;overflow:hidden;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--head);color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:24px}
.next::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 0,rgba(255,255,255,.06) 0 1px,transparent 1px 13px);pointer-events:none}
.next>*{position:relative}.next .days{text-align:center;min-width:76px;padding-right:22px;border-right:1px solid rgba(255,255,255,.18)}
.next .days b{display:block;font:600 2.8rem/1 var(--serif);color:#E2C27A}.next .days span{font-size:.85rem;color:#B9C1E6}
.next h2{color:#fff;margin:2px 0 4px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
.panel>header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}.panel>header h2,.panel>header h3{margin:0;font-size:1.12rem}
.panel .body{padding:20px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.84rem;color:var(--muted);font-weight:600;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr{transition:background .12s}tbody tr:hover{background:var(--surface2)}
td .ref{font-weight:700}
.seg{display:flex;gap:3px;margin-top:6px}.seg i{width:22px;height:5px;border-radius:3px;background:var(--line)}.seg i.on{background:var(--indigo2)}
.bd{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.bd.grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.bd.blue{background:var(--infosoft);color:var(--info)}.bd.sky{background:var(--isoft);color:var(--iink)}
.bd.amber{background:var(--warnsoft);color:var(--warn)}.bd.green{background:var(--oksoft);color:var(--ok)}.bd.orange{background:var(--bsoft);color:var(--brass)}.bd.red{background:var(--badsoft);color:var(--bad)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{margin:0;max-width:380px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);white-space:nowrap;font-weight:600;transition:color .15s,border-color .2s}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--brass)}
.empty{display:flex;gap:12px;align-items:center;padding:18px 20px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--muted);margin-bottom:22px}
/* notifications */
.nl{list-style:none;margin:0;padding:0}.nl>li{border-bottom:1px solid var(--line)}.nl>li:last-child{border:0}
.nrow{display:flex;align-items:center;gap:10px;padding-right:16px}.nrow:hover{background:var(--surface2)}
.nmain{display:flex;gap:14px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:14px 4px 14px 20px}
.ni{width:40px;height:40px;border-radius:12px;background:var(--isoft);color:var(--iink);display:grid;place-items:center;flex:none}
.un .ni{background:var(--btn);color:var(--btnfg)}.dotu{width:9px;height:9px;border-radius:50%;background:#E5484D;margin-top:8px;flex:none}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chs{display:inline-flex;gap:6px;flex-wrap:wrap}.chs span{display:inline-flex;gap:4px;align-items:center;font-size:.74rem;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.ev{padding:12px 20px}
/* chronologie */
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;display:flex;gap:16px;padding-bottom:26px}
.tl li::before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--line)}.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--indigo2)}

 if(s==='2')return v&&v.st!=='annule'?`${v.code}\n${fKs(v.day)} à ${v.slot}\nReçu par ${agN(v.agent)}${v.st==='reaffecte'?' (suppléant)':''}\n${ag(v.agent).guichet.split(' – ')[0]}\n\n9. Retour`:'Aucun rendez-vous à venir.\n\n9. Retour';

 `<div class="stats"><div class="stat"><b>${avD().length}</b><span>Dossiers actifs</span></div><div class="stat"><b>${m.filter(t=>['transmis','recu_plateforme','attente_verification'].includes(t.status)).length}</b><span>Actes en attente d’enregistrement</span></div><button class="stat" onclick="go('a_trans')"><b>${m.filter(t=>t.status==='regularisation').length}</b><span>Régularisation demandée</span></button><button class="stat" onclick="go('a_rap')"><b>${DB.rap.length}</b><span>Rapports pénaux suivis</span></button></div>
 <div class="qa">${[['upload','Déposer un acte','startDepot()'],['report','Rédiger un rapport pénal',"S.rap=null;go('a_rnew')"],['send','Suivre mes transmissions',"go('a_trans')"],['calendar','Calendrier procédural',"go('a_cal')"]].map(([i,t,a])=>`<button onclick="${a}"><span class="ico">${ic(i,22)}</span><span>${t}</span></button>`).join('')}</div>
 <div class="split"><div class="panel"><header><h2 class="grow">Dernières transmissions</h2><button class="btn sec sm" onclick="go('a_trans')">Tout voir</button></header>${tTable(m.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,4),'a_tdetail')}</div>
 <div class="panel"><header><h2 class="grow">Échéances</h2><button class="btn sec sm" onclick="go('a_cal')">Calendrier</button></header><ul class="nl">${next.slice(0,5).map(d=>`<li><div class="ev"><b>${fDs(d.ech)}</b>${daysTo(d.ech)<=7?` <span class="bd red">dans ${daysTo(d.ech)} j</span>`:''}<br>${d.echL}<br><span class="small muted">${d.ref}</span></div></li>`).join('')}</ul></div></div>`};
VIEWS.a_dossiers=()=>pageHead('Mes dossiers','Les dossiers dans lesquels vous êtes constitué.')+`<div class="panel"><table class="rt"><thead><tr><th>Référence</th><th>Parties</th><th>Nature</th><th>Échéance</th><th>Étape</th><th></th></tr></thead><tbody>${avD().map(d=>`<tr><td data-l="Référence"><span class="ref">${d.ref}</span>${d.penal?' <span class="bd red">Pénal</span>':''}<div class="small muted">${d.jur}</div></td><td data-l="Parties">${d.parties}</td><td data-l="Nature">${d.nature}</td><td data-l="Échéance">${d.ech?`<b>${fDs(d.ech)}</b><br><span class="small muted">${d.echL}</span>`:'—'}</td><td data-l="Étape"><b>${d.etat}</b>${mini(d)}</td><td>${d.penal?`<button class="btn sm" onclick="S.rap=newRap('${d.id}');go('a_rnew')">${ic('report',16)}Rapport</button>`:`<button class="btn sm" onclick="startDepot('${d.id}')">${ic('upload',16)}Déposer</button>`}</td></tr>`).join('')}</tbody></table></div>`;
VIEWS.a_trans=()=>{const l=mine().slice().sort((a,b)=>b.ts.localeCompare(a.ts));return pageHead('Mes transmissions','Chaque dépôt, de la réception technique à l’enregistrement au greffe.',`<button class="btn" onclick="startDepot()">${ic('plus',18)}Déposer un acte</button>`)+note()+`<div class="panel" style="margin-top:20px">${tTable(l,'a_tdetail')}</div>`};
VIEWS.a_tdetail=()=>{const t=tr(S.params.id),d=dos(t.dossierId);return crumb('Mes transmissions','a_trans')+pageHead(t.ref,esc(t.acte)+', dossier '+d.ref,badge(t.status)+(t.status==='regularisation'?`<button class="btn" onclick="regulModal('${t.id}')">${ic('edit',18)}Régulariser</button>`:''))+
 ((t.status==='regularisation'||t.status==='rejete')?`<div class="callout warnc" style="margin-bottom:20px">${ic('alert',22)}<div><b>${t.status==='rejete'?'Transmission rejetée':'Régularisation demandée'} par le greffe</b><br>${esc(t.motif)}</div></div>`:'')+
 `<div class="panel"><header><h2>Avancement</h2></header><div class="body">${tracker(t)}${seal(t,S.stampFor===t.id)}</div></div>${receipt(t)}<div class="grid g2" style="margin-top:22px;align-items:start"><div class="panel"><header><h3>Bordereau de communication des pièces</h3></header>${bordTable(t)}</div><div class="panel"><header><h3>Historique</h3></header><ul class="nl">${t.history.slice().reverse().map(h=>`<li><div class="ev"><span class="small muted">${fDT(h.ts)}, ${h.a}</span><br>${esc(h.t)}</div></li>`).join('')}</ul></div></div>`};
VIEWS.a_recus=()=>pageHead('Documents reçus','Documents adressés par les greffes.')+`<div class="panel"><table class="rt"><thead><tr><th>Document</th><th>Dossier</th><th>Expéditeur</th><th>Reçu le</th><th></th></tr></thead><tbody>${DB.recus.map(r=>`<tr><td data-l="Document"><span class="ref">${esc(r.t)}</span></td><td data-l="Dossier">${dos(r.d).ref}</td><td data-l="De">${r.from}</td><td data-l="Reçu le">${fDT(r.ts)}</td><td><button class="btn sec sm" onclick="dl()">${ic('download',16)}Télécharger</button></td></tr>`).join('')}</tbody></table></div>`;
VIEWS.a_cal=()=>{const [y,m]=S.cal,first=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),pad=x=>String(x).padStart(2,'0'),key=d=>`${y}-${pad(m+1)}-${pad(d)}`;
 const ev=DB.cal.filter(e=>e.d.startsWith(`${y}-${pad(m+1)}`)),by=d=>ev.filter(e=>e.d===key(d));let cells=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="dh">${x}</div>`).join('')+'<div class="c" style="background:var(--surface2)"></div>'.repeat(first);
 for(let d=1;d<=n;d++){const e=by(d);cells+=`<div class="c ${key(d)===TODAY?'td':''} ${e.length?'hasev':''}"><b>${d}</b>${e.map(x=>`<span class="e ${x.k}" title="${esc(x.t)}, ${dos(x.did).ref}">${esc(x.t)}</span>`).join('')}</div>`}
 const label=new Date(Date.UTC(y,m,1)).toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'});
 return pageHead('Calendrier procédural','Échéances et audiences de vos dossiers.')+`<div class="row" style="margin-bottom:14px"><button class="btn sec sm" onclick="calMv(-1)" aria-label="Mois précédent"><span style="display:inline-flex;transform:rotate(180deg)">${ic('chev',16)}</span></button><h2 style="margin:0;min-width:190px;text-align:center">${cap(label)}</h2><button class="btn sec sm" onclick="calMv(1)" aria-label="Mois suivant">${ic('chev',16)}</button></div>
 <div class="cal">${cells}</div><div class="panel" style="margin-top:20px"><header><h3>Ce mois-ci</h3></header>${ev.length?`<ul class="nl">${ev.map(e=>`<li><div class="row ev"><b style="min-width:92px">${fDs(e.d)}</b><span class="bd ${e.k==='a'?'blue':'sky'}">${e.k==='a'?'Audience':'Échéance'}</span><span class="grow">${esc(e.t)}, <span class="muted">${dos(e.did).ref}</span></span></div></li>`).join('')}</ul>`:'<div class="body muted">Aucun événement ce mois-ci.</div>'}</div>`};
function calMv(k){const d=new Date(Date.UTC(S.cal[0],S.cal[1]+k,1));S.cal=[d.getUTCFullYear(),d.getUTCMonth()];render()}

/* ===== Rapports pénaux (avocat) ===== */
const newRap=did=>({did:did||null,type:null,objet:'',faits:'',args:'',dem:'',pieces:[],cert:false,err:''});
function rapSave(){['objet','faits','args','dem'].forEach(k=>{const e=document.getElementById('r_'+k);if(e)S.rap[k]=e.value})}
function rapSet(k,v){rapSave();S.rap[k]=v;S.rap.err='';render()}
function rapFiles(inp){rapSave();for(const f of inp.files){if(!/\.pdf$/i.test(f.name)){S.rap.err='« '+f.name+' » n’est pas un PDF.';continue}S.rap.pieces.push({name:f.name,size:fSize(f.size)})}render()}
function rapEx(){const r=S.rap;r.did=r.did||'d6';r.type=r.type||RTYPES[0];r.objet='Analyse de la défense sur l’imputabilité des détournements';
 r.faits='Le prévenu, gérant de la boutique, est poursuivi pour abus de confiance portant sur 2 400 000 FCFA. Les relevés de caisse produits par la partie civile couvrent une période pendant laquelle il était en congé (pièce n° 1).';
 r.args='Les relevés ne permettent pas d’imputer les retraits au prévenu. Les plannings (pièce n° 2) montrent que trois autres employés avaient accès à la caisse sur la même période, sans contrôle des sessions.';
 r.dem='À titre principal, constater que l’imputabilité n’est pas établie. À titre subsidiaire, ordonner une expertise comptable des sessions de caisse.';
 r.pieces=[{name:'Attestation_de_conge.pdf',size:'180 Ko'},{name:'Plannings_mars_avril.pdf',size:'260 Ko'}];r.err='';render()}
function rapSubmit(){rapSave();const r=S.rap;let e='';
 if(!r.did)e='Choisissez le dossier concerné.';else if(!r.type)e='Choisissez le type de document.';else if(r.objet.trim().length<5)e='Indiquez l’objet du rapport.';else if(r.faits.trim().length<20)e='Rédigez le rappel des faits (20 caractères minimum).';else if(r.dem.trim().length<10)e='Précisez ce que vous demandez au magistrat.';else if(!document.getElementById('r_cert').checked)e='Cochez la case de certification pour transmettre.';
 if(e){r.err=e;render();return}
 const id='p'+(++DB.nid),d=dos(r.did),p={id,ref:'RP-2026-00'+(31+DB.rap.length),dossierId:r.did,type:r.type,objet:r.objet.trim(),faits:r.faits.trim(),args:r.args.trim(),dem:r.dem.trim(),pieces:r.pieces.slice(),ts:nowISO(),st:'transmis',history:[{ts:nowISO(),a:'Me Agbodjan',t:'Rapport transmis au greffe'}]};
 DB.rap.unshift(p);S.rap=null;notify('greffe','rapport','Nouveau rapport pénal',`${p.ref} transmis par ${SENDER.name}, dossier ${d.ref}.`,{v:'g_rdetail',p:{id}});go('a_rdetail',{id})}
const rTable=(l,v)=>l.length?`<table class="rt"><thead><tr><th>Rapport</th><th>Dossier</th><th>Type</th><th>Transmis le</th><th>Statut</th><th></th></tr></thead><tbody>${l.map(p=>`<tr><td data-l="Rapport"><span class="ref">${p.ref}</span><div class="small muted">${esc(p.objet)}</div></td><td data-l="Dossier">${dos(p.dossierId).ref}</td><td data-l="Type">${p.type}</td><td data-l="Date">${fDs(p.ts)}</td><td data-l="Statut">${rbadge(p.st)}</td><td><button class="btn sec sm" onclick="go('${v}',{id:'${p.id}'})">Ouvrir</button></td></tr>`).join('')}</tbody></table>`:'<div class="body muted">Aucun rapport pour le moment.</div>';
VIEWS.a_rap=()=>pageHead('Rapports pénaux','Votre analyse d’un dossier pénal, versée au dossier et remise au magistrat chargé de l’affaire.',`<button class="btn" onclick="S.rap=null;go('a_rnew')">${ic('plus',18)}Rédiger un rapport</button>`)+
 `<div class="panel" style="margin-bottom:20px"><div class="body">${rapTracker({st:'transmis'}).replace('class="cur"','class=""')}</div></div><div class="panel">${rTable(DB.rap,'a_rdetail')}</div>`;
VIEWS.a_rnew=()=>{if(!S.rap)S.rap=newRap();const r=S.rap,pen=avD().filter(d=>d.penal);
 return crumb('Rapports pénaux','a_rap')+pageHead('Rédiger un rapport','Le greffe le verse au dossier puis le remet au magistrat. Vous êtes prévenu à chaque étape.',`<button class="btn sec" onclick="rapSave();rapEx()">${ic('edit',18)}Remplir avec un exemple</button>`)+
 `<div class="split"><div class="panel"><div class="body fs">
 <h3>Dossier pénal concerné</h3><div class="choices">${pen.map(d=>`<button class="choice" aria-pressed="${r.did===d.id}" onclick="rapSet('did','${d.id}')">${d.ref}<span>${d.parties}</span><span>${d.mag}</span></button>`).join('')}</div>
 <h3>Type de document</h3><div class="chips">${RTYPES.map((t,i)=>`<button class="chip" aria-pressed="${r.type===t}" onclick="rapSet('type',RTYPES[${i}])">${t}</button>`).join('')}</div>
 <label class="f">Objet<input id="r_objet" value="${esc(r.objet)}" placeholder="Ex. : observations sur la qualification des faits"></label>
 <label class="f">Rappel des faits<span class="h">Les éléments du dossier utiles à votre analyse.</span><textarea id="r_faits">${esc(r.faits)}</textarea></label>
 <label class="f">Analyse et arguments de la défense<textarea id="r_args">${esc(r.args)}</textarea></label>
 <label class="f">Demandes au magistrat<span class="h">Ce que vous demandez, précisément.</span><textarea id="r_dem">${esc(r.dem)}</textarea></label>
 <h3>Pièces jointes</h3><label class="drop"><input type="file" class="sr" accept=".pdf,application/pdf" multiple onchange="rapFiles(this)">${ic('upload',28)}<br><b>Ajouter des pièces (PDF)</b><br><span class="small muted">10 Mo maximum par fichier</span></label>
 ${r.pieces.length?`<ul class="docs" style="margin-top:12px">${r.pieces.map((p,i)=>`<li><span class="di">${ic('clip',18)}</span><div class="grow"><b>Pièce n° ${i+1} : ${esc(p.name)}</b><div class="small muted">${p.size}</div></div><button class="btn sec sm" onclick="rapSave();S.rap.pieces.splice(${i},1);render()">Retirer</button></li>`).join('')}</ul>`:''}
 <label class="f chk" style="margin-top:20px"><input type="checkbox" id="r_cert" ${r.cert?'checked':''} onchange="S.rap.cert=this.checked"> Je certifie être constitué dans ce dossier et l’exactitude des éléments transmis.</label>
 ${r.err?`<p class="err" role="alert">${ic('alert',16)}${r.err}</p>`:''}<div class="wzf"><button class="btn sec" onclick="rapSave();toast('Brouillon enregistré','ok')">Enregistrer en brouillon</button><button class="btn" onclick="rapSubmit()">${ic('send',18)}Transmettre le rapport</button></div></div></div>
 <aside class="sticky"><div class="panel"><header><h3>Après l’envoi</h3></header><div class="body"><ol class="tl">${RSTEPS.map(([t,x])=>`<li class="todo"><span class="dot"></span><div><h4>${t}</h4><p>${x}</p></div></li>`).join('')}</ol></div></div>
 <div class="callout">${ic('lock',22)}<div><b>Diffusion restreinte.</b><br>Le rapport n’apparaît pas dans l’espace du justiciable. Son accès par les autres parties suit les règles habituelles de la procédure.</div></div></aside></div>`};
function rapBody(p){const d=dos(p.dossierId);return `<div class="panel"><header><h2 class="grow">${esc(p.objet)}</h2></header><div class="body prose"><dl class="kv"><dt>Dossier</dt><dd>${d.ref}<div class="small muted" style="font-weight:400">${d.parties}</div></dd><dt>Destinataire</dt><dd>${d.mag}</dd><dt>Type</dt><dd>${p.type}</dd><dt>Transmis le</dt><dd>${fDT(p.ts)}</dd>${p.cote?`<dt>Cote au dossier</dt><dd>${p.cote}</dd>`:''}</dl>
 <h4>Rappel des faits</h4><p>${esc(p.faits)}</p>${p.args?`<h4>Analyse et arguments de la défense</h4><p>${esc(p.args)}</p>`:''}<h4>Demandes au magistrat</h4><p>${esc(p.dem)}</p>
 <h4>Pièces jointes</h4>${p.pieces.length?`<ul class="docs">${p.pieces.map((f,i)=>`<li><span class="di">${ic('file',18)}</span><div class="grow"><b>Pièce n° ${i+1} : ${esc(f.name)}</b><div class="small muted">${f.size}</div></div><button class="btn sec sm" onclick="toast('Aperçu simulé du document')">${ic('eye',16)}Ouvrir</button></li>`).join('')}</ul>`:'<p class="muted">Aucune pièce.</p>'}</div></div>`}
const rHist=p=>`<div class="panel"><header><h3>Historique</h3></header><ul class="nl">${p.history.slice().reverse().map(h=>`<li><div class="ev"><span class="small muted">${fDT(h.ts)}, ${h.a}</span><br>${esc(h.t)}</div></li>`).join('')}</ul></div>`;
VIEWS.a_rdetail=()=>{const p=rp(S.params.id);return crumb('Rapports pénaux','a_rap')+pageHead(p.ref,p.type,rbadge(p.st))+`<div class="panel"><header><h2>Avancement</h2></header><div class="body">${rapTracker(p)}</div></div><div class="split"><div>${rapBody(p)}</div><div>${rHist(p)}</div></div>`};

/* ===== Assistant de dépôt (8 étapes) ===== */
const newWiz=d=>({step:d?2:1,dossierId:d||null,acte:null,qualite:null,concl:null,pieces:[],bmode:'auto',bordereau:null,certify:false,phase:null,tid:null,draftId:null,err:''});
function startDepot(d){S.wiz=newWiz(d);go('a_depot')}
function resumeDraft(id){const t=tr(id);S.wiz=Object.assign(newWiz(),JSON.parse(JSON.stringify(t.wiz)),{draftId:id});go('a_depot')}
const W=()=>S.wiz;
function wzSet(k,v){W()[k]=v;W().err='';render()}
function wzPrev(){W().step--;W().err='';render();window.scrollTo(0,0)}
function wzNext(){const w=W();let e='';
 if(w.step===1&&!w.dossierId)e='Sélectionnez un dossier pour continuer.';if(w.step===2&&!w.acte)e='Choisissez la nature de l’acte.';if(w.step===3&&!w.qualite)e='Indiquez votre qualité dans la procédure.';
 if(w.step===4&&!w.concl)e='Ajoutez le document principal au format PDF.';if(w.step===6&&w.pieces.length&&w.bmode==='upload'&&!w.bordereau)e='Ajoutez votre bordereau ou choisissez la génération automatique.';if(w.step===7&&!w.certify)e='Cochez la case de certification pour transmettre.';
 if(e){w.err=e;render();return}if(w.step===7){wzSubmit();return}w.step++;w.err='';render();window.scrollTo(0,0)}
function wzFiles(inp,k){const w=W();for(const f of inp.files){if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){w.err='« '+f.name+' » n’est pas un PDF. Seul le format PDF est accepté.';continue}if(f.size>10485760){w.err='« '+f.name+' » dépasse 10 Mo.';continue}
 const o={name:f.name,size:fSize(f.size)};w.err='';if(k==='pieces')w.pieces.push(o);else w[k]=o}render()}
function wzEx(k){const w=W(),d=dos(w.dossierId);w.err='';if(k==='concl')w.concl={name:(w.acte||'Conclusions').replace(/ /g,'_')+'_'+d.ref.replace(/\//g,'-')+'.pdf',size:'842 Ko'};
 else if(k==='pieces'){const n=w.pieces.length+1;w.pieces.push({name:'Piece_'+n+'_'+['Contrat','Facture','Courrier','Constat'][(n-1)%4]+'.pdf',size:'3'+n+'0 Ko'})}else w.bordereau={name:'Bordereau_pieces.pdf',size:'120 Ko',items:w.pieces.map((p,i)=>({n:i+1,t:p.name.replace(/^Piece_\d+_|\.pdf$/g,'')}))};render()}
function wzDraft(){const w=W(),id=w.draftId||'t'+(++DB.seq);let t=tr(id);const snap=JSON.parse(JSON.stringify(Object.assign({},w,{phase:null,err:''})));
 if(!t){t={id,ref:'BR-2026-'+String(7+DB.trans.length).padStart(4,'0'),sender:SENDER,history:[],status:'brouillon',pieces:[],concl:null,bordereau:null};DB.trans.push(t)}
 Object.assign(t,{dossierId:w.dossierId||'d1',acte:w.acte||'Acte à préciser',qualite:w.qualite,ts:nowISO(),wiz:snap});t.history.push({ts:nowISO(),a:'Me Agbodjan',t:'Brouillon enregistré'});w.draftId=id;toast('Brouillon enregistré dans « Mes transmissions »','ok')}
function wzSubmit(){const w=W();let bd=null;if(w.pieces.length)bd=w.bmode==='auto'?{name:'Bordereau_'+w.pieces.length+'_pieces.pdf',generated:true,items:w.pieces.map((p,i)=>({n:i+1,t:p.name.replace(/^Piece_\d+_|\.pdf$/g,'').replace(/_/g,' ')}))}:w.bordereau;
 if(w.draftId)DB.trans=DB.trans.filter(t=>t.id!==w.draftId);
 const id='t'+(++DB.seq),t={id,ref:'TR-2026-000'+DB.seq,dossierId:w.dossierId,acte:w.acte,qualite:w.qualite,sender:SENDER,ts:nowISO(),status:'transmis',concl:w.concl,pieces:w.pieces.slice(),bordereau:bd,history:[{ts:nowISO(),a:'Me Agbodjan',t:'Acte transmis'}]};
 DB.trans.push(t);w.step=8;w.phase='sending';w.tid=id;render();window.scrollTo(0,0);
 setTimeout(()=>{t.status='recu_plateforme';hist(t,'Plateforme','Accusé de réception technique émis');if(W())W().phase='done';
  notify('greffe','nouvelle_transmission','Nouvelle transmission',t.ref+' reçue de '+SENDER.name+', dossier '+dos(t.dossierId).ref+'.',{v:'g_detail',p:{id}});
  if(S.view==='a_depot')render()},1700)}
const dz=(k,label,multi)=>`<label class="drop"><input type="file" class="sr" accept=".pdf,application/pdf" ${multi?'multiple':''} onchange="wzFiles(this,'${k}')">${ic('upload',30)}<br><b>${label}</b><br><span class="small muted">PDF uniquement, 10 Mo maximum</span></label><p style="text-align:center;margin:10px 0 0"><button class="btn sec sm" onclick="wzEx('${k}')">Utiliser un fichier d’exemple</button></p>`;
VIEWS.a_depot=()=>{if(!S.wiz)S.wiz=newWiz();const w=W(),d=w.dossierId?dos(w.dossierId):null,err=w.err?`<p class="err" role="alert">${ic('alert',16)}${w.err}</p>`:'';let b='';
 if(w.step===1)b=`<h2>Pour quel dossier ?</h2><div class="choices">${avD().filter(x=>!x.penal).map(x=>`<button class="choice" aria-pressed="${w.dossierId===x.id}" onclick="wzSet('dossierId','${x.id}')">${x.ref}<span>${x.jur}</span><span>${x.parties}</span></button>`).join('')}</div>`;
 if(w.step===2)b=`<h2>Quel acte déposez-vous ?</h2><div class="choices">${ACTES.map((a,i)=>`<button class="choice" aria-pressed="${w.acte===a}" onclick="wzSet('acte',ACTES[${i}])">${a}</button>`).join('')}</div>`;
 if(w.step===3)b=`<h2>En quelle qualité ?</h2><div class="choices">${QUALITES.map(([q,x],i)=>`<button class="choice" aria-pressed="${w.qualite===q}" onclick="wzSet('qualite',QUALITES[${i}][0])">${q}<span>${x}</span></button>`).join('')}</div>`;
 if(w.step===4)b=`<h2>Ajoutez vos ${/Mémoire/.test(w.acte||'')?'mémoires':'conclusions'}</h2>${dz('concl','Choisir le fichier PDF')}${w.concl?`<ul class="docs" style="margin-top:14px"><li><span class="di">${ic('file',18)}</span><div class="grow"><b>${esc(w.concl.name)}</b><div class="small muted">${w.concl.size}</div></div><button class="btn sec sm" onclick="wzSet('concl',null)">Retirer</button></li></ul>`:''}`;
 if(w.step===5)b=`<h2>Des pièces à communiquer ?</h2><p class="muted">Facultatif. Ajoutez une ou plusieurs pièces.</p>${dz('pieces','Choisir les pièces (PDF)',true)}${w.pieces.length?`<ul class="docs" style="margin-top:14px">${w.pieces.map((p,i)=>`<li><span class="di">${ic('clip',18)}</span><div class="grow"><b>Pièce n° ${i+1} : ${esc(p.name)}</b><div class="small muted">${p.size}</div></div><button class="btn sec sm" onclick="W().pieces.splice(${i},1);render()">Retirer</button></li>`).join('')}</ul>`:''}`;
 if(w.step===6)b=`<h2>Bordereau de communication des pièces</h2>${w.pieces.length?`<div class="choices"><button class="choice" aria-pressed="${w.bmode==='auto'}" onclick="wzSet('bmode','auto')">Le générer automatiquement<span>Numérote vos ${w.pieces.length} pièce(s)</span></button><button class="choice" aria-pressed="${w.bmode==='upload'}" onclick="wzSet('bmode','upload')">Ajouter mon bordereau<span>Fichier PDF préparé par vos soins</span></button></div>
  ${w.bmode==='auto'?`<div class="panel"><table><thead><tr><th>N°</th><th>Pièce communiquée</th></tr></thead><tbody>${w.pieces.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name.replace(/^Piece_\d+_|\.pdf$/g,'').replace(/_/g,' '))}</td></tr>`).join('')}</tbody></table></div>`:dz('bordereau','Choisir le bordereau (PDF)')+(w.bordereau?`<p class="small" style="margin-top:10px">${ic('clip',16)} ${esc(w.bordereau.name)}</p>`:'')}`:`<div class="callout">${ic('help',22)}<div>Aucune pièce complémentaire : le bordereau n’est pas nécessaire. Passez à l’étape suivante.</div></div>`}`;
 if(w.step===7){const bd=w.pieces.length?(w.bmode==='auto'?'Bordereau généré ('+w.pieces.length+' pièces)':w.bordereau?.name||'—'):'Non requis';b=`<h2>Vérifiez avant d’envoyer</h2><dl class="kv"><dt>Dossier</dt><dd>${d.ref}<div class="small muted" style="font-weight:400">${d.jur}</div></dd><dt>Nature de l’acte</dt><dd>${esc(w.acte)}</dd><dt>Qualité</dt><dd>${esc(w.qualite)}</dd><dt>Document principal</dt><dd>${esc(w.concl.name)}</dd><dt>Pièces</dt><dd>${w.pieces.length?w.pieces.map(p=>esc(p.name)).join('<br>'):'Aucune'}</dd><dt>Bordereau</dt><dd>${esc(bd)}</dd></dl>
  <label class="f chk" style="margin-top:20px"><input type="checkbox" ${w.certify?'checked':''} onchange="wzSet('certify',this.checked)"> Je certifie l’exactitude des informations déclarées et la conformité des documents transmis.</label>`}
 if(w.step===8){const t=tr(w.tid);b=w.phase==='sending'?`<div style="text-align:center;padding:30px 0"><div class="spin"></div><h2>Envoi en cours</h2><p class="muted">Transmission sécurisée vers le greffe du ${d.jur}…</p></div>`:
  `<div class="callout okc" style="margin-bottom:20px">${ic('check',22)}<div><b>Votre acte est transmis.</b><br>Le greffe va le vérifier puis l’enregistrer. Vous serez prévenu à chaque changement.</div></div>${tracker(t)}<div style="margin:20px 0">${receipt(t)}</div><div class="wzf"><button class="btn sec" onclick="dl()">${ic('download',18)}Télécharger l’accusé</button><span class="row"><button class="btn sec" onclick="startDepot()">Nouveau dépôt</button><button class="btn" onclick="S.wiz=null;go('a_trans')">Voir mes transmissions</button></span></div>`}
 const foot=w.step<8?`${err}<div class="wzf"><span class="row"><button class="btn sec" ${w.step===1?'disabled':''} onclick="wzPrev()">Précédent</button><button class="btn sec" onclick="wzDraft()">Enregistrer en brouillon</button></span><button class="btn" onclick="wzNext()">${w.step===7?ic('send',18)+'Transmettre au greffe':'Continuer'}</button></div>`:'';
 return pageHead('Déposer un acte','Transmission électronique d’un acte de procédure au greffe.')+`<div class="panel"><div class="body"><ol class="wz" aria-label="Progression">${WSTEPS.map((s,i)=>`<li class="${i+1<w.step?'done':i+1===w.step?'cur':''}"><span class="n">${i+1<w.step?ic('check',16):i+1}</span><span class="t">${s}</span></li>`).join('')}</ol>
 <div class="wzp"><i style="width:${w.step/8*100}%"></i></div><p class="small muted">Étape ${w.step} sur 8 : ${WSTEPS[w.step-1]}</p>${b}${foot}</div></div>`};

/* ===== Espace greffe ===== */
const gF={nouvelles:t=>['transmis','recu_plateforme'].includes(t.status),attente:t=>t.status==='attente_verification',enregistrees:t=>t.status==='enregistre',regul:t=>t.status==='regularisation',rejetees:t=>t.status==='rejete',toutes:t=>t.status!=='brouillon'};
const gC=k=>DB.trans.filter(gF[k]).length;
function allOps(){const o=[];DB.trans.forEach(t=>t.history.forEach(h=>o.push(Object.assign({ref:t.ref,id:t.id,v:'g_detail'},h))));DB.rap.forEach(p=>p.history.forEach(h=>o.push(Object.assign({ref:p.ref,id:p.id,v:'g_rdetail'},h))));return o.sort((a,b)=>b.ts.localeCompare(a.ts))}
VIEWS.g_dash=()=>{const abs=DB.agents.filter(a=>a.absent),rt=DB.rdvs.filter(r=>r.day===TODAY&&r.st!=='annule').length,rap=DB.rap.filter(p=>p.st==='transmis'||p.st==='verse').length;
 return pageHead('Bonjour, '+USERS.greffe.name,'Greffe du '+J1+'.')+
 (abs.length?`<div class="callout warnc" style="margin-bottom:22px">${ic('swap',22)}<div><b>${abs.map(a=>agN(a.id)).join(', ')} ${abs.length>1?'sont absents':'est '+(abs[0].civ==='Mme'?'absente':'absent')} aujourd’hui.</b><br>Leurs rendez-vous ont été repris par les suppléants et les justiciables prévenus.</div></div>`:'')+
 `<div class="stats"><button class="stat" onclick="S.gtab='nouvelles';go('g_list')"><b>${gC('nouvelles')}</b><span>Nouvelles transmissions</span></button><button class="stat" onclick="go('g_rap')"><b>${rap}</b><span>Rapports pénaux à traiter</span></button><button class="stat" onclick="go('g_rdv')"><b>${rt}</b><span>Rendez-vous aujourd’hui</span></button><button class="stat" onclick="go('g_verif')"><b>${DB.pend.length}</b><span>Comptes à vérifier</span></button></div>
 <div class="panel"><header><h2 class="grow">Dernières transmissions</h2><button class="btn sec sm" onclick="S.gtab='toutes';go('g_list')">Tout voir</button></header>${tTable(DB.trans.filter(gF.toutes).sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,5),'g_detail',true)}</div>
 <div class="panel"><header><h2 class="grow">Activité récente</h2><button class="btn sec sm" onclick="go('g_histo')">Historique complet</button></header><ul class="nl">${allOps().slice(0,5).map(h=>`<li><div class="row ev"><span class="small muted" style="min-width:140px">${fDT(h.ts)}</span><span class="grow">${esc(h.t)} <span class="muted">(${h.ref}, ${h.a})</span></span></div></li>`).join('')}</ul></div>`};
VIEWS.g_list=()=>{const tabs=[['nouvelles','Nouvelles'],['attente','En vérification'],['enregistrees','Enregistrées'],['regul','À régulariser'],['rejetees','Rejetées'],['toutes','Toutes']];
 const l=DB.trans.filter(gF[S.gtab]).sort((a,b)=>b.ts.localeCompare(a.ts));return pageHead('Transmissions','Actes transmis par les avocats.')+`<div class="tabs" role="tablist">${tabs.map(([k,x])=>`<button role="tab" aria-selected="${S.gtab===k}" onclick="S.gtab='${k}';render()">${x} (${gC(k)})</button>`).join('')}</div><div class="panel">${tTable(l,'g_detail',true,'Aucune transmission dans cette catégorie.')}</div>`};
VIEWS.g_histo=()=>pageHead('Historique des opérations','Journal de toutes les opérations sur les transmissions et les rapports.')+`<div class="panel"><table class="rt"><thead><tr><th>Date et heure</th><th>Opération</th><th>Référence</th><th>Acteur</th></tr></thead><tbody>${allOps().map(h=>`<tr><td data-l="Date">${fDT(h.ts)}</td><td data-l="Opération">${esc(h.t)}</td><td data-l="Référence"><button class="btn sec sm" onclick="go('${h.v}',{id:'${h.id}'})">${h.ref}</button></td><td data-l="Acteur">${h.a}</td></tr>`).join('')}</tbody></table></div>`;
VIEWS.g_detail=()=>{const t=tr(S.params.id),d=dos(t.dossierId),s=t.status,can=(...a)=>a.includes(s)?'':'disabled';
 return crumb('Transmissions','g_list')+pageHead(t.ref,esc(t.acte)+', dossier '+d.ref,badge(s))+
 `<div class="split"><div><div class="panel"><header><h2>Transmission reçue</h2></header><div class="body"><dl class="kv"><dt>Expéditeur</dt><dd>${esc(t.sender.name)}<div class="small muted" style="font-weight:400">${t.sender.role}</div></dd><dt>Dossier</dt><dd>${d.ref}<div class="small muted" style="font-weight:400">${d.jur}</div></dd><dt>Parties</dt><dd>${d.parties}</dd><dt>Nature de l’acte</dt><dd>${esc(t.acte)}</dd><dt>Qualité déclarée</dt><dd>${esc(t.qualite||'—')}</dd><dt>Reçue le</dt><dd>${fDT(t.ts)}</dd></dl>${t.motif&&(s==='regularisation'||s==='rejete')?`<p class="err" style="margin-top:14px">${ic('alert',16)}Motif communiqué : ${esc(t.motif)}</p>`:''}</div></div>
 <div class="panel"><header><h3>Documents joints</h3></header><div class="body">${docList(t)}</div></div><div class="panel"><header><h3>Bordereau de pièces</h3></header>${bordTable(t)}</div></div>
 <div><div class="panel"><header><h2>Que faire ?</h2></header><div class="body"><div class="grid" style="gap:10px">
 <button class="btn" ${can('transmis','recu_plateforme')} onclick="confirmReception('${t.id}')">${ic('inbox',18)}Confirmer la réception</button>
 <button class="btn okb" ${can('attente_verification')} onclick="registerAct('${t.id}')">${ic('shield',18)}Enregistrer au greffe</button>
 <button class="btn sec" ${can('recu_plateforme','attente_verification')} onclick="motifModal('${t.id}','regul')">${ic('edit',18)}Demander une régularisation</button>
 <button class="btn sec" ${can('recu_plateforme','attente_verification')} onclick="motifModal('${t.id}','rejet')">${ic('ban',18)}Rejeter avec motif</button>
 <button class="btn ghost" onclick="S.hist=!S.hist;render()">${ic('history',18)}${S.hist?'Masquer':'Afficher'} l’historique</button></div>
 ${s==='recu_plateforme'||s==='transmis'?'<p class="small muted" style="margin:12px 0 0">Confirmez d’abord la réception pour lancer la vérification, puis enregistrez l’acte.</p>':''}${s==='attente_verification'?'<p class="small muted" style="margin:12px 0 0">Après contrôle des pièces, enregistrez l’acte ou demandez une régularisation.</p>':''}</div></div>
 <div class="panel"><header><h3>Avancement</h3></header><div class="body">${tracker(t)}${seal(t,S.stampFor===t.id)}</div></div>
 ${S.hist?`<div class="panel"><header><h3>Historique</h3></header><ul class="nl">${t.history.slice().reverse().map(h=>`<li><div class="ev"><span class="small muted">${fDT(h.ts)}, ${h.a}</span><br>${esc(h.t)}</div></li>`).join('')}</ul></div>`:''}</div></div>`};
VIEWS.g_rap=()=>pageHead('Rapports pénaux','Rapports des avocats à verser au dossier et à remettre au magistrat chargé de l’affaire.')+`<div class="panel">${rTable(DB.rap.slice().sort((a,b)=>RORD.indexOf(a.st)-RORD.indexOf(b.st)),'g_rdetail')}</div>`;
VIEWS.g_rdetail=()=>{const p=rp(S.params.id),d=dos(p.dossierId),s=p.st;
 return crumb('Rapports pénaux','g_rap')+pageHead(p.ref,p.type+', transmis par '+SENDER.name,rbadge(s))+`<div class="panel"><header><h2>Avancement</h2></header><div class="body">${rapTracker(p)}</div></div>
 <div class="split"><div>${rapBody(p)}</div><div><div class="panel"><header><h2>Que faire ?</h2></header><div class="body"><div class="grid" style="gap:10px">
 <button class="btn" ${s==='transmis'?'':'disabled'} onclick="rapVerser('${p.id}')">${ic('folder',18)}Verser au dossier</button>
 <button class="btn" ${s==='verse'?'':'disabled'} onclick="rapRemettre('${p.id}')">${ic('scale',18)}Remettre au magistrat</button></div>
 <p class="small muted" style="margin:12px 0 0">Destinataire : ${d.mag}. L’avocat est prévenu à chaque étape.</p>
 ${s==='magistrat'?`<div class="secure" style="margin-top:14px">${ic('eye',20)}<div><span>Démonstration : simuler la lecture du rapport par le magistrat.</span><br><button class="btn sec sm" style="margin-top:8px" onclick="rapConsult('${p.id}')">Marquer comme consulté</button></div></div>`:''}</div></div>${rHist(p)}</div></div>`};
VIEWS.g_rdv=()=>{const today=DB.rdvs.filter(r=>r.day===TODAY&&r.st!=='annule').sort((a,b)=>a.slot.localeCompare(b.slot));
 return pageHead('Rendez-vous et suppléance',cap(fK(TODAY))+'. Chaque agent a un suppléant désigné : une absence ne renvoie plus personne chez soi.')+
 `<div class="grid g3" style="margin-bottom:24px">${DB.agents.map(a=>{const n=today.filter(r=>r.agent===a.id).length;return `<div class="card agent ${a.absent?'abs':''}"><span class="avatar">${a.name.split(' ').map(x=>x[0]).join('')}</span><div class="grow"><b>${agN(a.id)}</b><div class="small muted">${a.guichet}</div>
 <div class="row" style="margin:10px 0;gap:8px">${a.absent?`<span class="bd red">${a.civ==='Mme'?'Absente':'Absent'}</span>`:`<span class="bd green">${a.civ==='Mme'?'Présente':'Présent'}</span>`}<span class="bd grey">${n} rendez-vous</span></div>
 <div class="small muted">Suppléant désigné : ${agN(a.supp)}</div><div style="margin-top:12px">${a.absent?`<button class="btn sec sm" onclick="agBack('${a.id}')">Signaler son retour</button>`:`<button class="btn sm" onclick="absModal('${a.id}')">${ic('alert',16)}Signaler une absence</button>`}</div></div></div>`}).join('')}</div>
 <div class="panel"><header><h2>Rendez-vous du jour</h2></header>${today.length?`<table class="rt"><thead><tr><th>Heure</th><th>Justiciable</th><th>Démarche</th><th>Reçu par</th><th>Statut</th></tr></thead><tbody>${today.map(r=>`<tr><td data-l="Heure"><b>${r.slot}</b></td><td data-l="Justiciable">${esc(r.name)}<div class="small muted">${r.code}</div></td><td data-l="Démarche">${SVCS[r.svc][0]}</td><td data-l="Reçu par">${agN(r.agent)}</td><td data-l="Statut">${r.st==='reaffecte'?`<span class="bd orange">${ic('swap',14)}Repris, justiciable prévenu</span>`:'<span class="bd green">Confirmé</span>'}</td></tr>`).join('')}</tbody></table>`:'<div class="body muted">Aucun rendez-vous aujourd’hui.</div>'}</div>`};
VIEWS.g_acc=()=>{const a=S.acc,u=USERS.justiciable;
 return pageHead('Accueil assisté','Pour le justiciable qui se présente au guichet sans smartphone ou sans internet. L’agent fait la démarche avec lui.')+
 `<div class="split"><div><div class="panel"><div class="body"><label class="f" style="margin:0">NPI du justiciable<span class="h">Lu sur sa carte d’identité biométrique ou son certificat d’identification personnelle.</span></label>
 <div class="row" style="margin-top:6px"><input id="acc_npi" class="grow" style="margin:0;flex:1" inputmode="numeric" maxlength="10" value="${a?esc(a.npi):'1234567890'}" onkeydown="if(event.key==='Enter')accFind()"><button class="btn" onclick="accFind()">${ic('search',18)}Rechercher</button></div>${a&&a.err?`<p class="err">${ic('alert',16)}${a.err}</p>`:''}</div></div>
 ${a&&a.ok?`<div class="panel" style="animation:fade .3s"><header><span class="avatar">RA</span><div class="grow"><h2 style="margin:0">${u.name}</h2><span class="vf">${ic('shield',14)}Identité confirmée par l’ANIP (simulation)</span></div></header><div class="body"><dl class="kv"><dt>Téléphone</dt><dd>${u.telM}</dd><dt>Procédures</dt><dd>${myD().map(d=>`${d.ref}<div class="small muted" style="font-weight:400">${d.etat}</div>`).join('')}</dd></dl>
 <h3 style="margin-top:20px">Que souhaite-t-il faire ?</h3><div class="grid g2" style="gap:10px">
 <button class="choice" onclick="accCall()">${ic('volume',20)} Lui faire entendre l’état de son dossier<span>Appel vocal envoyé sur son téléphone</span></button>
 <button class="choice" onclick="accRdv()">${ic('calendar',20)} Lui fixer un rendez-vous<span>Confirmé par SMS et appel vocal</span></button>
 <button class="choice" onclick="accCopy()">${ic('copy',20)} Enregistrer une demande de copie<span>Paiement au guichet ou par Mobile Money</span></button>
 <button class="choice" onclick="toast('Code de suivi imprimé : SUIVI-4821 (simulation)','ok')">${ic('file',20)} Imprimer son code de suivi<span>Pour le code USSD ou un prochain passage</span></button></div>
 ${a.done&&a.done.length?`<h4 style="margin-top:20px">Fait pendant cet accueil</h4><ul class="docs">${a.done.map(x=>`<li><span class="di">${ic('check',18)}</span><span>${x}</span></li>`).join('')}</ul>`:''}</div></div>`:''}</div>
 <aside><div class="callout">${ic('hand',22)}<div><b>Le justiciable n’a besoin ni de compte ni d’internet.</b><br>Il repart avec un code de suivi et reçoit les nouvelles de son dossier par SMS ou appel vocal, dans sa langue.</div></div></aside></div>`};
function accFind(){const v=val('acc_npi').replace(/\s/g,'');if(!/^\d{10}$/.test(v)){S.acc={npi:v,err:'Le NPI comporte 10 chiffres.'};render();return}
 if(v!==USERS.justiciable.npi){S.acc={npi:v,err:'Aucun justiciable trouvé pour ce NPI dans la base de démonstration. Essayez 1234567890.'};render();return}S.acc={npi:v,ok:true,done:[]};render()}
function accCall(){callModal(dosVoice(dos('d1')),'Message envoyé au '+USERS.justiciable.telM);S.acc.done.push('État du dossier communiqué par appel vocal');render()}
function accRdv(){const day=workdays(1)[0],code='RDV-'+(4900+DB.rdvs.length);DB.rdvs.push({id:'v'+(++DB.nid),code,who:'justiciable',name:USERS.justiciable.name,svc:'consult',jur:J1,day,slot:'09:00',agent:'a1',st:'confirme'});
 notify('justiciable','rdv','Rendez-vous fixé au guichet',`${code} : ${fK(day)} à 09:00, consultation du dossier.`,{v:'rdv'},`Bonjour, ici le portail de la justice. Un rendez-vous a été fixé pour vous ${fK(day)} à 9 heures, au greffe du tribunal de Cotonou.`);
 S.acc.done.push(`Rendez-vous ${code} fixé ${fK(day)} à 09:00`);render()}
function accCopy(){const fid='f'+(++DB.nid),id='DC-2026-'+String(DB.demandes.length+45).padStart(4,'0'),d=dos('d4');DB.fees.push({id:fid,role:'justiciable',l:'Copie simple de la décision',ref:d.ref,m:1000,st:'du'});
 DB.demandes.unshift({id,d:d.id,type:'Copie simple de la décision',motif:'Demande enregistrée au guichet.',ts:nowISO(),statut:'En attente de paiement',fee:fid});
 notify('justiciable','info','Demande de copie enregistrée au guichet',`${id} : ${money(1000)} à régler au guichet ou par Mobile Money.`,{v:'j_dem'});S.acc.done.push(`Demande ${id} enregistrée, ${money(1000)} à régler`);render()}
VIEWS.g_verif=()=>pageHead('Comptes à vérifier','Avocats dont le numéro n’a pas été trouvé automatiquement sur la liste de l’Ordre. Un agent vérifie avant toute activation.')+
 (DB.pend.length?DB.pend.map(p=>`<div class="card" style="margin-bottom:14px;animation:fade .3s"><div class="row" style="align-items:flex-start"><span class="avatar">${ic('id',22)}</span><div class="grow"><b>${esc(p.name)}</b><div class="small muted">N° déclaré : ${esc(p.num)}, demande du ${fDT(p.ts)}</div><p class="small" style="margin:8px 0 0">${esc(p.motif)}</p></div>
 <div class="row"><button class="btn sec sm" onclick="vNo('${p.id}')">${ic('ban',16)}Refuser</button><button class="btn okb sm" onclick="vOk('${p.id}')">${ic('check',16)}Activer après vérification</button></div></div></div>`).join(''):`<div class="empty">${ic('check',22)}<span>Aucune demande en attente. Chaque nouvelle demande apparaîtra ici.</span></div>`)+
 `<div class="callout">${ic('help',22)}<div>Vérification recommandée : appel au secrétariat de l’Ordre ou consultation de la dernière liste officielle. La décision et son motif sont journalisés.</div></div>`;
function vOk(id){const p=DB.pend.find(x=>x.id===id);DB.pend=DB.pend.filter(x=>x.id!==id);toast(`Compte ${p.num} activé. L’avocat est prévenu par SMS et courriel.`,'ok');render()}
function vNo(id){const p=DB.pend.find(x=>x.id===id);DB.pend=DB.pend.filter(x=>x.id!==id);toast(`Demande ${p.num} refusée. Le motif est communiqué au demandeur.`,'ok');render()}

/* ===== Démarrage ===== */
render();
</script>
</body>
</html>
